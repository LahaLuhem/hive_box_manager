name: hbm_example
description: Runnable demos of every hive_box_manager box family, one feature per family.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_ui: ^1.1.1
  flutter:
    sdk: flutter
  fpdart: ^1.2.0
  hive_box_manager:
    path: ../
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.3.4
  listenable_collections: ^3.0.0
  material_ui: ^1.0.1
  platform_adaptive_widgets: ^2.2.0
  platform_icons: ^0.1.1
  pmvvm: ^4.0.1

dev_dependencies:
  bdd_framework: ^4.0.7
  checks: ^0.3.2
  dartender_lints:
    git:
      url: https://github.com/LahaLuhem/dartender.git
      path: lints
      ref: main
  dependency_validator: ^5.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
