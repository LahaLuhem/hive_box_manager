# Written by dartender's scripts/setup/callers.sh, whose next run undoes hand edits.
name: Codegen

on:
  # Every branch, since the drift lands on whichever one caused it.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Dependabot is told to ignore the pinned generators, so this is what moves them.
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

jobs:
  codegen:
    uses: LahaLuhem/dartender/.github/workflows/codegen.yml@main
    # For reading the run that failed. The App's token does the writing.
    permissions:
      contents: read
      actions: read
    # The changelog App's, which the rulesets let past to push the regen.
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
