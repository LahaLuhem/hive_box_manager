name: Example checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}-example
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: example

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: flutter --no-version-check analyze .

  deps:
    name: Dependency validator (example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: dart pub global activate dependency_validator
      - run: dart pub global run dependency_validator

  test:
    name: Widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: flutter --no-version-check test

  # master's required check for this workflow; the job id IS the context, so
  # don't rename it or give it a `name:`. APPENDIX.md#dependabot-automerge
  example-ok:
    needs: [analyze, deps, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    # The file-level default points at example/, which this job never checks out.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: >-
            analyze=${{ needs.analyze.result }}
            deps=${{ needs.deps.result }}
            test=${{ needs.test.result }}
        run: |
          echo "$RESULTS"
          exit 1
