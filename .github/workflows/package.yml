name: Package checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  # Pull-request runs cancel each other per PR; master-branch runs cancel only
  # against later master commits. The `|| github.ref` fallback keeps the group
  # well-formed on push events where `pull_request.number` is empty.
  group: pkg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Dart analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      # Scope to the pure-Dart surface; the Flutter example is analysed in its own
      # workflow (it needs the Flutter SDK, absent here).
      - run: dart --no-version-check analyze lib test benchmark

  deps:
    name: Dependency validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - run: dart pub global activate dependency_validator
      - run: dart pub global run dependency_validator

  browser-test:
    name: Browser tests (dart2js + dart2wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      # Browser flakiness gets its own job so it never blocks the VM lanes; the
      # `browser` tag carries a retry in dart_test.yaml because headless-chrome
      # startup, not the tests, is the flaky part.
      - run: dart test -p chrome --tags browser
      - run: dart test -p chrome -c dart2wasm --tags browser

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    # OIDC upload to Codecov needs id-token:write. The workflow's top-level
    # permissions are contents:read; this job opts into the extra scope only
    # where it's used, so every other job stays least-privilege.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - run: dart pub global activate coverage
      - run: dart test --coverage=coverage
      - name: Format coverage as lcov
        # `--check-ignore` makes `format_coverage` honour the
        # `// coverage:ignore-line`, `ignore-start`/`ignore-end`, and
        # `ignore-file` pragmas in source files. Without it, the directives
        # are silently inert.
        run: |
          dart pub global run coverage:format_coverage \
            --lcov \
            --check-ignore \
            --in=coverage \
            --report-on=lib \
            --packages=.dart_tool/package_config.json \
            -o coverage/lcov.info
      # Upload to Codecov. Project + patch coverage are enforced as PR status
      # checks configured in codecov.yml, so there's no in-CI threshold step
      # here (mark those checks required on master to actually block merges).
      # OIDC auth (no CODECOV_TOKEN secret); the Codecov GitHub App must be
      # installed on the repo. `fail_ci_if_error` makes a broken upload a red
      # job instead of a silently lost report.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: true
