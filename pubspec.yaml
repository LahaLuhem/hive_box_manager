name: hive_box_manager
description: >-
  Type-safe, FP-style abstraction layers for Hive's boxes. Provides Managers for almost all
  conceivable use-cases and scenarios.
version: 1.1.0
repository: https://github.com/LahaLuhem/hive_box_manager





environment:
  sdk: '>=3.13.0 <4.0.0'





dependencies:
  fpdart: ^1.2.0
  hive_ce: ^2.19.3
  # Blocked by hive_ce
  meta: ^1.14.0





dev_dependencies:
  benchmark_harness: ^2.4.0
  build_runner: ^2.16.0
  checks: ^0.3.1
  collection: ^1.19.1
  mockito: ^5.8.1
  test: ^1.31.2





cider:
  link_template:
    tag: https://github.com/LahaLuhem/hive_box_manager/releases/%version%
    diff: https://github.com/LahaLuhem/hive_box_manager/compare/%from%...%to%
