name: hive_box_manager
description: >-
  Typed, fpdart-first boxes over hive_ce. Reads return an Option instead of null, writes are lazy
  Tasks, CRUD comes ready-made, and each shape of data gets its own box.
version: 1.2.0
repository: https://github.com/LahaLuhem/hive_box_manager

topics:
  - hive
  - database
  - nosql
  - functional-programming
  - type-safety

screenshots:
  - description: >-
      The example app's hub, with one demo per box family. Each demo docks a live log of the events
      its box fires.
    path: doc/screenshots/1-overview.png





environment:
  sdk: '>=3.13.0 <4.0.0'





dependencies:
  collection: ^1.19.1
  fpdart: ^1.2.0
  hive_ce: ^2.20.1
  # Blocked by hive_ce
  meta: ^1.14.0





dev_dependencies:
  benchmark_harness: ^2.4.0
  build_runner: ^2.16.0
  checks: ^0.3.1
  dartender_lints:
    git:
      url: https://github.com/LahaLuhem/dartender.git
      path: lints
      ref: main
  dependency_validator: ^5.1.0
  mockito: ^5.8.1
  test: ^1.31.2





cider:
  link_template:
    tag: https://github.com/LahaLuhem/hive_box_manager/releases/%version%
    diff: https://github.com/LahaLuhem/hive_box_manager/compare/%from%...%to%
